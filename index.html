<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Cafe Auto-Fill Portal</title>
    <!-- PDF Processing Engine -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #eef2f5; margin: 0; padding: 20px; }
        .container { max-width: 500px; background: #ffffff; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: 600; display: block; margin-bottom: 5px; color: #333; }
        input[type="text"], input[type="file"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .checkbox-group input { width: auto; }
        button { width: 100%; background-color: #28a745; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        button:hover { background-color: #218838; }
        .security-badge { text-align: center; font-size: 12px; color: #666; margin-top: 15px; background: #e8f5e9; padding: 8px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>সরকারি ফর্ম অটো-ফিল ও ডাউনলোড</h2>

    <form id="autoFillForm">
        <!-- খালি PDF আপলোড সেকশন -->
        <div class="form-group">
            <label>১. সরকারি প্রকল্পের খালি PDF ফর্ম নির্বাচন করুন:</label>
            <input type="file" id="pdfTemplate" accept="application/pdf" required>
        </div>

        <hr style="border: 0.5px solid #eee; margin: 20px 0;">

        <!-- ইনপুট প্যানেল / শর্টকাট অপশন -->
        <div class="form-group">
            <label>আবেদনকারীর নাম:</label>
            <input type="text" id="applicantName" placeholder="পূর্ণ নাম লিখুন" required>
        </div>

        <div class="form-group">
            <label>পিতা / স্বামীর নাম:</label>
            <input type="text" id="guardianName" placeholder="অভিভাবকের নাম" required>
        </div>

        <div class="form-group">
            <label>আধার নম্বর (সুরক্ষিত):</label>
            <input type="text" id="aadhaarNo" placeholder="১২ সংখ্যার আধার নম্বর" required>
        </div>

        <div class="form-group">
            <label>ভোটার নম্বর (Full):</label>
            <input type="text" id="voterNo" placeholder="ভোটার কার্ড নম্বর" required>
        </div>

        <div class="form-group">
            <label>PAN নম্বর:</label>
            <input type="text" id="panNo" placeholder="PAN কার্ড নম্বর" required>
        </div>

        <div class="form-group">
            <label>সম্পূর্ণ ঠিকানা:</label>
            <input type="text" id="address" placeholder="গ্রাম/শহর, পিন কোড সহ" required>
        </div>

        <!-- টিক / আনটিক অপশন -->
        <div class="checkbox-group">
            <input type="checkbox" id="declaration">
            <label for="declaration">সমস্ত নিয়মাবলী মেনে নেওয়া হলো (Tick Mark)</label>
        </div>

        <button type="button" onclick="generateAndClearPDF()">Submit & Download (Charge ₹10)</button>
    </form>

    <div class="security-badge">
        🔒 <b>Zero Data Retention Guarantee:</b> ডাউনলোডের সাথে সাথে স্ক্রিনের সমস্ত তথ্য ব্রাউজার থেকে স্থায়ীভাবে মুছে যাবে।
    </div>
</div>

<script>
    async function generateAndClearPDF() {
        const fileInput = document.getElementById('pdfTemplate');
        const name = document.getElementById('applicantName').value;
        const guardian = document.getElementById('guardianName').value;
        const aadhaar = document.getElementById('aadhaarNo').value;
        const voter = document.getElementById('voterNo').value;
        const pan = document.getElementById('panNo').value;
        const address = document.getElementById('address').value;
        const isChecked = document.getElementById('declaration').checked;

        if (fileInput.files.length === 0) {
            alert("অনুগ্রহ করে একটি সরকারি PDF ফাইল আপলোড/সিলেক্ট করুন!");
            return;
        }

        if (!name || !aadhaar) {
            alert("জরুরি ঘরগুলো (নাম, আধার) সঠিকভাবে পূরণ করুন!");
            return;
        }

        try {
            // ১. PDF ফাইল রিড করা
            const file = fileInput.files[0];
            const fileArrayBuffer = await file.arrayBuffer();
            
            // ২. PDF-lib দিয়ে ফাইল লোড করা
            const pdfDoc = await PDFLib.PDFDocument.load(fileArrayBuffer);
            const pages = pdfDoc.getPages();
            const firstPage = pages[0]; // প্রথম পেজ নেওয়া হলো

            // ৩. PDF-এর নির্দিষ্ট জায়গায় (X, Y স্থানাঙ্কে) টেক্সট বসানো
            // নোট: বিভিন্ন ফর্ম অনুযায়ী X এবং Y-এর মান সমন্বয় করে নিতে পারেন
            firstPage.drawText(name, { x: 150, y: 700, size: 12 });
            firstPage.drawText(guardian, { x: 150, y: 670, size: 12 });
            firstPage.drawText(aadhaar, { x: 150, y: 640, size: 12 });
            firstPage.drawText(voter, { x: 150, y: 610, size: 12 });
            firstPage.drawText(pan, { x: 150, y: 580, size: 12 });
            firstPage.drawText(address, { x: 150, y: 550, size: 12 });

            if(isChecked) {
                firstPage.drawText("X", { x: 150, y: 520, size: 14 }); // টিক মার্কের জন্য
            }

            // ৪. ফাইল সেভ ও ডাউনলোড প্রসেস
            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Filled_Form_${Date.now()}.pdf`;
            link.click();

            // ৫. প্রাইভেসি সিকিউরিটি: ডাউনলোডের সাথে সাথেই পেজের সমস্ত ডেটা রিসেট
            document.getElementById("autoFillForm").reset();
            alert("PDF সফলভাবে ডাউনলোড হয়েছে এবং গ্রাহকের সমস্ত তথ্য স্ক্রিন থেকে মুছে ফেলা হয়েছে!");

        } catch (error) {
            console.error(error);
            alert("PDF প্রসেস করতে সমস্যা হয়েছে! সঠিক PDF ফাইল দিয়ে চেষ্টা করুন।");
        }
    }
</script>

</body>
  </html>

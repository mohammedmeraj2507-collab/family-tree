<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বংশতালিকা - Tentulia Gram Panchayat</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; padding: 16px; text-align: center; }
    
    .container { max-width: 1200px; margin: auto; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); text-align: left; }
    .card h3 { margin-top: 0; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
    
    .form-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
    .form-group input[type="text"], .form-group select { flex: 1; min-width: 160px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .checkbox-label { display: flex; align-items: center; gap: 6px; font-weight: bold; font-size: 14px; color: #15803d; background: #dcfce7; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    
    .btn { background: #059669; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn:hover { background: #047857; }
    .btn-print { background: #2563eb; margin-top: 15px; }
    
    .header-title { text-align: center; margin-bottom: 15px; }
    .header-title h3 { margin: 2px 0; color: #475569; font-size: 16px; }
    .header-title h2 { margin: 6px 0; color: #0f172a; border-bottom: 2px dashed #0f172a; display: inline-block; padding-bottom: 4px; font-size: 20px; }

    /* Org-Chart Structure */
    .tree-container { width: 100%; overflow-x: auto; padding: 10px 0; text-align: center; }
    .tf-tree { display: inline-block; text-align: center; }
    .tf-tree ul { display: flex; padding-top: 15px; position: relative; justify-content: center; margin: 0; padding-left: 0; }
    .tf-tree li { float: left; text-align: center; list-style-type: none; position: relative; padding: 15px 4px 0 4px; }
    
    /* Connection Lines */
    .tf-tree li::before, .tf-tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid #475569; width: 50%; height: 15px; }
    .tf-tree li::after { right: auto; left: 50%; border-left: 2px solid #475569; }
    .tf-tree li:only-child::after, .tf-tree li:only-child::before { display: none; }
    .tf-tree li:only-child { padding-top: 0; }
    .tf-tree li:first-child::before, .tf-tree li:last-child::after { border: none; }
    .tf-tree li:last-child::before { border-right: 2px solid #475569; border-radius: 0 5px 0 0; }
    .tf-tree li:first-child::after { border-radius: 5px 0 0 0; }
    .tf-tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid #475569; width: 0; height: 15px; }
    
    /* Base Node Box Styling */
    .node {
      border: 2px solid #475569;
      padding: 10px 8px;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      border-radius: 8px;
      background: #ffffff;
      width: 155px;
      height: fit-content;
      min-height: auto;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      position: relative;
      word-break: break-word;
    }

    /* গ্রিন সিগন্যাল লিংকেজ বক্স */
    .node.signal-box {
      border: 2.5px solid #15803d !important;
      background: #f0fdf4 !important;
    }
    .node.signal-box .node-relation {
      background: #bbf7d0 !important;
      color: #166534 !important;
    }

    /* ছবি ও প্রোফাইল প্রেজেন্টেশন */
    .node img { 
      width: 55px; 
      height: 55px; 
      border-radius: 50%; 
      object-fit: cover; 
      margin-bottom: 4px; 
      border: 2px solid #94a3b8; 
      background: #fff;
    }
    .avatar-placeholder { 
      width: 55px; 
      height: 55px; 
      border-radius: 50%; 
      background: #e2e8f0; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 24px; 
      margin-bottom: 4px; 
      border: 1px solid #cbd5e1;
    }

    .node-relation { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: bold; margin-bottom: 4px; background: #e2e8f0; color: #334155; }
    .node-name { font-weight: bold; font-size: 14px; color: #0f172a; margin-bottom: 4px; }
    .node-details { font-size: 10.5px; color: #334155; text-align: center; line-height: 1.4; width: 100%; }
    
    .delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* আবেদনকারীর মন্তব্য ও স্বাক্ষর সেকশন */
    .declaration-section {
      margin-top: 35px;
      padding: 12px;
      border: 1.5px dashed #64748b;
      border-radius: 8px;
      text-align: left;
      font-size: 12px;
      color: #1e293b;
      background: #fafafa;
    }
    .declaration-title {
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 6px;
      color: #0f172a;
      text-decoration: underline;
    }

    /* এডিটেবল মন্তব্য বক্স */
    .comment-textarea {
      width: 100%;
      min-height: 50px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      font-family: Arial, sans-serif;
      resize: vertical;
      color: #1e293b;
      background: #ffffff;
      line-height: 1.4;
    }

    /* ৩টি স্বাক্ষর লাইন (নতুন ক্রম অনুযায়ী) */
    .signature-container {
      margin-top: 45px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      color: #334155;
    }
    .sig-box {
      text-align: center;
    }
    .sig-line {
      border-top: 1px dashed #475569;
      width: 170px;
      padding-top: 4px;
      font-size: 12px;
      font-weight: bold;
    }

    /* Print Setup for Single A4 Landscape Page */
    @page {
      size: A4 landscape;
      margin: 6mm;
    }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; padding: 0; margin: 0; }
      .container { max-width: 100%; width: 100%; margin: 0; }
      .card { box-shadow: none; border: none; padding: 0; margin: 0; }
      .tree-container { overflow: visible; zoom: 85%; }
      .declaration-section { background: transparent; border: 1px dashed #000; }
      .comment-textarea { 
        border: none; 
        padding: 0; 
        background: transparent; 
        resize: none; 
        font-size: 12px;
        overflow: hidden;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ইনপুট প্যানেল -->
  <div class="card no-print">
    <h3>নতুন সদস্য যোগ করুন</h3>
    <div class="form-group">
      <input id="name" type="text" placeholder="সদস্যের নাম (আবশ্যক)">
      <select id="relation">
        <option value="দাদু">দাদু / মূল অভিভাবক</option>
        <option value="পিতা">পিতা</option>
        <option value="মাতা">মাতা</option>
        <option value="পুত্র">পুত্র</option>
        <option value="কন্যা">কন্যা</option>
      </select>
      <input id="aadharNo" type="text" placeholder="আধার নম্বর">
    </div>
    <div class="form-group">
      <input id="voterId" type="text" placeholder="ভোটার আইডি">
      <input id="assembly" type="text" placeholder="বিধানসভার নাম">
      <input id="partNo" type="text" placeholder="পার্ট নম্বর">
    </div>
    <div class="form-group">
      <input id="serialNo" type="text" placeholder="সিরিয়াল নম্বর">
      <input id="voterYear" type="text" placeholder="ভোটার লিস্টের বছর (যেমন: 2024 / 2026)">
      <select id="parent">
        <option value="">কার অধীনে যুক্ত হবে? (অভিভাবক নির্বাচন করুন)</option>
      </select>
    </div>
    <div class="form-group">
      <input id="photo" type="file" accept="image/*">
      <label class="checkbox-label">
        <input id="isSignal" type="checkbox"> 🟢 সিগন্যাল বক্স (মূল লিংক চিহ্নিত করুন)
      </label>
      <button class="btn" onclick="addMember()">সদস্য যোগ করুন</button>
    </div>
  </div>

  <!-- প্রিন্টযোগ্য বংশতালিকা -->
  <div class="card">
    <div class="header-title">
      <h3>Tentulia Gram Panchayat</h3>
      <h3>Tentulia, Murshidabad</h3>
      <h2>-: বংশতালিকা :-</h2>
    </div>

    <!-- ট্রি কন্টেইনার -->
    <div class="tree-container">
      <div id="tree" class="tf-tree"></div>
    </div>

    <!-- আবেদনকারীর মন্তব্য ও ৩টি স্বাক্ষর সেকশন -->
    <div class="declaration-section">
      <div class="declaration-title">আবেদনকারীর মন্তব্য / ঘোষণা:</div>
      <textarea class="comment-textarea" placeholder="এখানে আপনার মন্তব্য বা ঘোষণা লিখুন...">আমি এতদ্বারা ঘোষণা করছি যে, উপরে প্রদত্ত বংশতালিকার যাবতীয় তথ্য সম্পূর্ণ সত্য ও নির্ভুল। ভবিষ্যতে কোনো তথ্য ভুল বা মিথ্যা প্রমাণিত হলে আমি তার জন্য দায়ী থাকিব।</textarea>
      
      <div class="signature-container">
        <!-- ১. পঞ্চায়েত প্রধান স্বাক্ষর -->
        <div class="sig-box">
          <div class="sig-line">পঞ্চায়েত প্রধান স্বাক্ষর</div>
        </div>
        <!-- ২. মেম্বার স্বাক্ষর -->
        <div class="sig-box">
          <div class="sig-line">মেম্বার স্বাক্ষর</div>
        </div>
        <!-- ৩. আবেদনকারীর স্বাক্ষর -->
        <div class="sig-box">
          <div class="sig-line">আবেদনকারীর স্বাক্ষর</div>
        </div>
      </div>
    </div>
  </div>

  <button class="btn btn-print no-print" onclick="window.print()">প্রিন্ট করুন (A4)</button>
</div>

<script>
  let members = [];

  function addMember() {
    const nameInput = document.getElementById('name');
    const relationInput = document.getElementById('relation');
    const aadharNoInput = document.getElementById('aadharNo');
    const voterIdInput = document.getElementById('voterId');
    const assemblyInput = document.getElementById('assembly');
    const partNoInput = document.getElementById('partNo');
    const serialNoInput = document.getElementById('serialNo');
    const voterYearInput = document.getElementById('voterYear');
    const parentSelect = document.getElementById('parent');
    const photoInput = document.getElementById('photo');
    const isSignalInput = document.getElementById('isSignal');

    const name = nameInput.value.trim();
    const relation = relationInput.value;
    const aadharNo = aadharNoInput.value.trim();
    const voterId = voterIdInput.value.trim();
    const assembly = assemblyInput.value.trim();
    const partNo = partNoInput.value.trim();
    const serialNo = serialNoInput.value.trim();
    const voterYear = voterYearInput.value.trim();
    const parent = parentSelect.value;
    const isSignal = isSignalInput.checked;
    const file = photoInput.files[0];

    if (!name) {
      alert('দয়া করে সদস্যের নাম লিখুন!');
      return;
    }

    const saveAndRefresh = (imgData) => {
      const newMember = {
        id: 'id_' + Date.now(),
        name,
        relation,
        aadharNo,
        voterId,
        assembly,
        partNo,
        serialNo,
        voterYear,
        parent,
        isSignal,
        img: imgData || ''
      };
      members.push(newMember);

      // রিসেট ইনপুট
      nameInput.value = '';
      aadharNoInput.value = '';
      voterIdInput.value = '';
      assemblyInput.value = '';
      partNoInput.value = '';
      serialNoInput.value = '';
      voterYearInput.value = '';
      photoInput.value = '';
      isSignalInput.checked = false;

      updateUI();
    };

    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        saveAndRefresh(e.target.result);
      };
      reader.readAsDataURL(file);
    } else {
      saveAndRefresh('');
    }
  }

  function deleteMember(id) {
    if (confirm('আপনি কি এই সদস্য এবং তাঁর সকল সন্তানদের মুছে ফেলতে চান?')) {
      const removeRecursive = (targetId) => {
        const children = members.filter(m => m.parent === targetId);
        children.forEach(c => removeRecursive(c.id));
        members = members.filter(m => m.id !== targetId);
      };
      removeRecursive(id);
      updateUI();
    }
  }

  function updateUI() {
    const parentSelect = document.getElementById('parent');
    parentSelect.innerHTML = '<option value="">কার অধীনে যুক্ত হবে? (অভিভাবক নির্বাচন করুন)</option>';
    members.forEach(m => {
      parentSelect.innerHTML += `<option value="${m.id}">${m.name} (${m.relation})</option>`;
    });

    const roots = members.filter(m => !m.parent);
    const treeDiv = document.getElementById('tree');

    if (roots.length === 0) {
      treeDiv.innerHTML = '<p style="color:#94a3b8;">এখনো কোনো সদস্য যোগ করা হয়নি। প্রথম সদস্য হিসেবে "দাদু" যোগ করুন।</p>';
      return;
    }

    treeDiv.innerHTML = '<ul>' + roots.map(r => renderNode(r)).join('') + '</ul>';
  }

  function renderNode(person) {
    const children = members.filter(m => m.parent === person.id);
    
    let imageHTML = person.img 
      ? `<img src="${person.img}" alt="${person.name}">` 
      : `<div class="avatar-placeholder">👤</div>`;

    let aadharHTML = person.aadharNo ? `<div>Aadhaar: ${person.aadharNo}</div>` : '';
    let voterHTML = person.voterId ? `<div>Voter: ${person.voterId}</div>` : '';
    let assemblyHTML = person.assembly ? `<div>${person.assembly}</div>` : '';
    
    let partSerialArr = [];
    if (person.partNo) partSerialArr.push(`Part: ${person.partNo}`);
    if (person.serialNo) partSerialArr.push(`Sl: ${person.serialNo}`);
    let partSerialHTML = partSerialArr.length > 0 ? `<div>${partSerialArr.join(', ')}</div>` : '';

    let yearHTML = person.voterYear ? `<div>Voter List Year: ${person.voterYear}</div>` : '';

    let signalClass = person.isSignal ? 'signal-box' : '';

    let html = `<li>
      <div class="node ${signalClass}">
        <button class="delete-btn no-print" onclick="deleteMember('${person.id}')" title="ডিলিট করুন">✕</button>
        ${imageHTML}
        <div class="node-relation">${person.relation}</div>
        <div class="node-name">${person.name}</div>
        <div class="node-details">
          ${aadharHTML}
          ${voterHTML}
          ${assemblyHTML}
          ${partSerialHTML}
          ${yearHTML}
        </div>
      </div>`;

    if (children.length > 0) {
      html += '<ul>' + children.map(c => renderNode(c)).join('') + '</ul>';
    }

    html += '</li>';
    return html;
  }

  updateUI();
</script>

</body>
  </html>

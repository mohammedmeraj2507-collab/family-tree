<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Tree - Tentulia Gram Panchayat</title>
  <!-- Modern Font Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: #f8fafc; 
      color: #0f172a;
      margin: 0; 
      padding: 24px 16px; 
      text-align: center; 
    }
    
    .container { max-width: 1200px; margin: auto; }
    
    /* Premium Card Design */
    .card { 
      background: #ffffff; 
      border-radius: 16px; 
      padding: 24px; 
      margin-bottom: 24px; 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); 
      border: 1px solid #e2e8f0;
      text-align: left; 
    }
    .card h3 { 
      margin-top: 0; 
      font-size: 18px;
      font-weight: 700;
      color: #1e293b; 
      border-bottom: 2px solid #f1f5f9; 
      padding-bottom: 12px; 
      margin-bottom: 16px;
    }
    
    /* Modern Form Inputs */
    .form-group { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
    .form-group input[type="text"], .form-group select, .form-group input[type="file"] { 
      flex: 1; 
      min-width: 180px; 
      padding: 11px 14px; 
      border: 1px solid #cbd5e1; 
      border-radius: 8px; 
      font-size: 13.5px; 
      font-family: inherit;
      background-color: #f8fafc;
      transition: all 0.2s ease;
      color: #334155;
    }
    .form-group input[type="text"]:focus, .form-group select:focus {
      outline: none;
      border-color: #2563eb;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .checkbox-label { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      font-weight: 600; 
      font-size: 13px; 
      color: #15803d; 
      background: #f0fdf4; 
      border: 1px solid #bbf7d0;
      padding: 10px 14px; 
      border-radius: 8px; 
      cursor: pointer; 
      user-select: none;
    }
    
    /* Buttons */
    .btn { 
      background: #059669; 
      color: white; 
      border: none; 
      padding: 11px 22px; 
      border-radius: 8px; 
      font-weight: 600; 
      cursor: pointer; 
      font-size: 14px; 
      font-family: inherit;
      box-shadow: 0 2px 4px rgba(5, 150, 105, 0.2);
      transition: all 0.2s;
    }
    .btn:hover { background: #047857; transform: translateY(-1px); }
    .btn-print { 
      background: #2563eb; 
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
      padding: 12px 28px;
    }
    .btn-print:hover { background: #1d4ed8; }
    
    /* Document Header Header Styling */
    .header-title { text-align: center; margin-bottom: 20px; }
    .header-title h3 { margin: 2px 0; color: #64748b; font-size: 15px; font-weight: 600; border: none; padding: 0; }
    .header-title h2 { 
      margin: 8px 0; 
      color: #0f172a; 
      border-bottom: 2px dashed #94a3b8; 
      display: inline-block; 
      padding-bottom: 4px; 
      font-size: 22px; 
      letter-spacing: 1px;
    }

    /* Org-Chart Structure */
    .tree-container { width: 100%; overflow-x: auto; padding: 15px 0; text-align: center; }
    .tf-tree { display: inline-block; text-align: center; }
    .tf-tree ul { display: flex; padding-top: 18px; position: relative; justify-content: center; margin: 0; padding-left: 0; }
    .tf-tree li { float: left; text-align: center; list-style-type: none; position: relative; padding: 18px 5px 0 5px; }
    
    /* Connection Lines */
    .tf-tree li::before, .tf-tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid #64748b; width: 50%; height: 18px; }
    .tf-tree li::after { right: auto; left: 50%; border-left: 2px solid #64748b; }
    .tf-tree li:only-child::after, .tf-tree li:only-child::before { display: none; }
    .tf-tree li:only-child { padding-top: 0; }
    .tf-tree li:first-child::before, .tf-tree li:last-child::after { border: none; }
    .tf-tree li:last-child::before { border-right: 2px solid #64748b; border-radius: 0 6px 0 0; }
    .tf-tree li:first-child::after { border-radius: 6px 0 0 0; }
    .tf-tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid #64748b; width: 0; height: 18px; }
    
    /* Card/Node Box Styling */
    .node {
      border: 1.5px solid #cbd5e1;
      padding: 12px 10px;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      border-radius: 12px;
      background: #ffffff;
      width: 165px;
      height: fit-content;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      position: relative;
      word-break: break-word;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    /* Green Highlight Signal Box */
    .node.signal-box {
      border: 2px solid #16a34a !important;
      background: #f0fdf4 !important;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.15);
    }
    .node.signal-box .node-relation {
      background: #dcfce7 !important;
      color: #15803d !important;
    }

    /* Profile Presentation */
    .node img { 
      width: 58px; 
      height: 58px; 
      border-radius: 50%; 
      object-fit: cover; 
      margin-bottom: 6px; 
      border: 2px solid #e2e8f0; 
      background: #fff;
    }
    .avatar-placeholder { 
      width: 58px; 
      height: 58px; 
      border-radius: 50%; 
      background: #f1f5f9; 
      color: #64748b;
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 26px; 
      margin-bottom: 6px; 
      border: 1px solid #cbd5e1;
    }

    .node-relation { 
      font-size: 11px; 
      padding: 3px 10px; 
      border-radius: 12px; 
      font-weight: 700; 
      margin-bottom: 6px; 
      background: #f1f5f9; 
      color: #475569; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .node-name { font-weight: 700; font-size: 14px; color: #0f172a; margin-bottom: 6px; line-height: 1.2; }
    .node-details { font-size: 11px; color: #475569; text-align: center; line-height: 1.45; width: 100%; }
    
    .delete-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .delete-btn:hover { opacity: 1; }

    /* Applicant Remarks Section */
    .declaration-section {
      margin-top: 35px;
      padding: 16px;
      border: 1.5px dashed #94a3b8;
      border-radius: 12px;
      text-align: left;
      font-size: 12.5px;
      color: #334155;
      background: #f8fafc;
    }
    .declaration-title {
      font-weight: 700;
      font-size: 13.5px;
      margin-bottom: 8px;
      color: #0f172a;
      text-decoration: underline;
    }

    .comment-textarea {
      width: 100%;
      min-height: 55px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px;
      font-size: 12.5px;
      font-family: inherit;
      resize: vertical;
      color: #1e293b;
      background: #ffffff;
      line-height: 1.5;
    }

    /* Modern Signature Lines */
    .signature-container {
      margin-top: 50px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      color: #334155;
    }
    .sig-box {
      text-align: center;
    }
    .sig-line {
      border-top: 1.5px dashed #475569;
      width: 180px;
      padding-top: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #1e293b;
    }

    /* Print Setup for A4 Landscape */
    @page {
      size: A4 landscape;
      margin: 6mm;
    }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; padding: 0; margin: 0; }
      .container { max-width: 100%; width: 100%; margin: 0; }
      .card { box-shadow: none; border: none; padding: 0; margin: 0; }
      .tree-container { overflow: visible; zoom: 85%; }
      .declaration-section { background: transparent; border: 1px dashed #64748b; }
      .comment-textarea { 
        border: none; 
        padding: 0; 
        background: transparent; 
        resize: none; 
        font-size: 12px;
        overflow: hidden;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Input Panel -->
  <div class="card no-print">
    <h3>Add New Member</h3>
    <div class="form-group">
      <input id="name" type="text" placeholder="Member Name (Required)">
      <select id="relation">
        <option value="Grandfather">Grandfather / Primary Guardian</option>
        <option value="Father">Father</option>
        <option value="Mother">Mother</option>
        <option value="Son">Son</option>
        <option value="Daughter">Daughter</option>
      </select>
      <input id="aadharNo" type="text" placeholder="Aadhaar Number">
    </div>
    <div class="form-group">
      <input id="voterId" type="text" placeholder="Voter ID">
      <input id="assembly" type="text" placeholder="Assembly Name">
      <input id="partNo" type="text" placeholder="Part No.">
    </div>
    <div class="form-group">
      <input id="serialNo" type="text" placeholder="Serial No.">
      <input id="voterYear" type="text" placeholder="Voter List Year (e.g., 2024 / 2026)">
      <select id="parent">
        <option value="">Under whom will it be added? (Select Guardian)</option>
      </select>
    </div>
    <div class="form-group">
      <input id="photo" type="file" accept="image/*">
      <label class="checkbox-label">
        <input id="isSignal" type="checkbox"> 🟢 Signal Box (Highlight Main Link)
      </label>
      <button class="btn" onclick="addMember()">Add Member</button>
    </div>
  </div>

  <!-- Printable Family Tree -->
  <div class="card">
    <div class="header-title">
      <h3>Tentulia Gram Panchayat</h3>
      <h3>Tentulia, Murshidabad</h3>
      <h2>-: FAMILY TREE :-</h2>
    </div>

    <!-- Tree Container -->
    <div class="tree-container">
      <div id="tree" class="tf-tree"></div>
    </div>

    <!-- Applicant Remarks & Signatures -->
    <div class="declaration-section">
      <div class="declaration-title">Applicant Remark / Declaration:</div>
      <textarea class="comment-textarea" placeholder="Write your remark or declaration here...">I hereby declare that all the information provided in the family tree above is true and correct to the best of my knowledge. If any information is proven false or incorrect in the future, I shall be held responsible.</textarea>
      
      <div class="signature-container">
        <!-- 1. Panchayet Prodhan Signature -->
        <div class="sig-box">
          <div class="sig-line">Panchayet Prodhan Signature</div>
        </div>
        <!-- 2. Member Signature -->
        <div class="sig-box">
          <div class="sig-line">Member Signature</div>
        </div>
        <!-- 3. Applicant Signature -->
        <div class="sig-box">
          <div class="sig-line">Applicant Signature</div>
        </div>
      </div>
    </div>
  </div>

  <button class="btn btn-print no-print" onclick="window.print()">Print Document (A4)</button>
</div>

<script>
  let members = [];

  function addMember() {
    const nameInput = document.getElementById('name');
    const relationInput = document.getElementById('relation');
    const aadharNoInput = document.getElementById('aadharNo');
    const voterIdInput = document.getElementById('voterId');
    const assemblyInput = document.getElementById('assembly');
    const partNoInput = document.getElementById('partNo');
    const serialNoInput = document.getElementById('serialNo');
    const voterYearInput = document.getElementById('voterYear');
    const parentSelect = document.getElementById('parent');
    const photoInput = document.getElementById('photo');
    const isSignalInput = document.getElementById('isSignal');

    const name = nameInput.value.trim();
    const relation = relationInput.value;
    const aadharNo = aadharNoInput.value.trim();
    const voterId = voterIdInput.value.trim();
    const assembly = assemblyInput.value.trim();
    const partNo = partNoInput.value.trim();
    const serialNo = serialNoInput.value.trim();
    const voterYear = voterYearInput.value.trim();
    const parent = parentSelect.value;
    const isSignal = isSignalInput.checked;
    const file = photoInput.files[0];

    if (!name) {
      alert('Please enter the member\'s name!');
      return;
    }

    const saveAndRefresh = (imgData) => {
      const newMember = {
        id: 'id_' + Date.now(),
        name,
        relation,
        aadharNo,
        voterId,
        assembly,
        partNo,
        serialNo,
        voterYear,
        parent,
        isSignal,
        img: imgData || ''
      };
      members.push(newMember);

      // Reset Inputs
      nameInput.value = '';
      aadharNoInput.value = '';
      voterIdInput.value = '';
      assemblyInput.value = '';
      partNoInput.value = '';
      serialNoInput.value = '';
      voterYearInput.value = '';
      photoInput.value = '';
      isSignalInput.checked = false;

      updateUI();
    };

    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        saveAndRefresh(e.target.result);
      };
      reader.readAsDataURL(file);
    } else {
      saveAndRefresh('');
    }
  }

  function deleteMember(id) {
    if (confirm('Are you sure you want to delete this member and all their children?')) {
      const removeRecursive = (targetId) => {
        const children = members.filter(m => m.parent === targetId);
        children.forEach(c => removeRecursive(c.id));
        members = members.filter(m => m.id !== targetId);
      };
      removeRecursive(id);
      updateUI();
    }
  }

  function updateUI() {
    const parentSelect = document.getElementById('parent');
    parentSelect.innerHTML = '<option value="">Under whom will it be added? (Select Guardian)</option>';
    members.forEach(m => {
      parentSelect.innerHTML += `<option value="${m.id}">${m.name} (${m.relation})</option>`;
    });

    const roots = members.filter(m => !m.parent);
    const treeDiv = document.getElementById('tree');

    if (roots.length === 0) {
      treeDiv.innerHTML = '<p style="color:#94a3b8; font-size:14px;">No members added yet. Add "Grandfather" as the first member.</p>';
      return;
    }

    treeDiv.innerHTML = '<ul>' + roots.map(r => renderNode(r)).join('') + '</ul>';
  }

  function renderNode(person) {
    const children = members.filter(m => m.parent === person.id);
    
    let imageHTML = person.img 
      ? `<img src="${person.img}" alt="${person.name}">` 
      : `<div class="avatar-placeholder">👤</div>`;

    let aadharHTML = person.aadharNo ? `<div>Aadhaar: ${person.aadharNo}</div>` : '';
    let voterHTML = person.voterId ? `<div>Voter: ${person.voterId}</div>` : '';
    let assemblyHTML = person.assembly ? `<div>${person.assembly}</div>` : '';
    
    let partSerialArr = [];
    if (person.partNo) partSerialArr.push(`Part: ${person.partNo}`);
    if (person.serialNo) partSerialArr.push(`Sl: ${person.serialNo}`);
    let partSerialHTML = partSerialArr.length > 0 ? `<div>${partSerialArr.join(', ')}</div>` : '';

    let yearHTML = person.voterYear ? `<div>Voter List Year: ${person.voterYear}</div>` : '';

    let signalClass = person.isSignal ? 'signal-box' : '';

    let html = `<li>
      <div class="node ${signalClass}">
        <button class="delete-btn no-print" onclick="deleteMember('${person.id}')" title="Delete">✕</button>
        ${imageHTML}
        <div class="node-relation">${person.relation}</div>
        <div class="node-name">${person.name}</div>
        <div class="node-details">
          ${aadharHTML}
          ${voterHTML}
          ${assemblyHTML}
          ${partSerialHTML}
          ${yearHTML}
        </div>
      </div>`;

    if (children.length > 0) {
      html += '<ul>' + children.map(c => renderNode(c)).join('') + '</ul>';
    }

    html += '</li>';
    return html;
  }

  updateUI();
</script>

</body>
        </html>

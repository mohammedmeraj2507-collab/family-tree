<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বংশতালিকা - Tentulia Gram Panchayat</title>
  <style>
    body { font-family: 'SolaimanLipi', Arial, sans-serif; background: #f9fafb; margin: 0; padding: 20px; text-align: center; }
    .header { margin-bottom: 20px; }
    .header h3 { margin: 2px 0; color: #444; font-weight: normal; }
    .header h2 { margin: 10px 0; font-size: 24px; border-bottom: 2px dashed #666; display: inline-block; padding-bottom: 4px; }
    
    /* Tree Layout */
    .tf-tree { display: inline-block; text-align: center; }
    .tf-tree ul { display: flex; padding-top: 20px; position: relative; justify-content: center; margin: 0; padding-left: 0; }
    .tf-tree li { float: left; text-align: center; list-style-type: none; position: relative; padding: 20px 5px 0 5px; }
    
    /* Connectors (Connecting Lines) */
    .tf-tree li::before, .tf-tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid #333; width: 50%; height: 20px; }
    .tf-tree li::after { right: auto; left: 50%; border-left: 2px solid #333; }
    .tf-tree li:only-child::after, .tf-tree li:only-child::before { display: none; }
    .tf-tree li:only-child { padding-top: 0; }
    .tf-tree li:first-child::before, .tf-tree li:last-child::after { border: none; }
    .tf-tree li:last-child::before { border-right: 2px solid #333; border-radius: 0 5px 0 0; }
    .tf-tree li:first-child::after { border-radius: 5px 0 0 0; }
    .tf-tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid #333; width: 0; height: 20px; }
    
    /* Node Styling */
    .node {
      border: 2px solid #333;
      padding: 8px 14px;
      display: inline-block;
      border-radius: 6px;
      background: #fff;
      font-weight: bold;
      min-width: 70px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
    }
    .applicant { background: #e0f2fe; border-color: #0284c7; color: #0369a1; }

    @media print {
      body { background: #fff; }
      .no-print { display: none; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h3>Tentulia Gram Panchayat</h3>
    <h3>Tentulia, Murshidabad</h3>
    <h2>-: বংশতালিকা :-</h2>
  </div>

  <div class="tf-tree">
    <ul>
      <li>
        <div class="node">দাদা</div>
        <ul>
          <!-- Generation 2 -->
          <li><div class="node">ছেলে</div></li>
          <li>
            <div class="node">ছেলে</div>
            <ul>
              <!-- Generation 3 -->
              <li><div class="node">ছেলে</div></li>
              <li><div class="node">মেয়ে</div></li>
              <li>
                <div class="node">ছেলে</div>
                <ul>
                  <!-- Generation 4 -->
                  <li>
                    <div class="node applicant">ছেলে (আবেদনকারী)</div>
                  </li>
                  <li><div class="node">ছেলে</div></li>
                  <li><div class="node">মেয়ে</div></li>
                </ul>
              </li>
            </ul>
          </li>
          <li><div class="node">ছেলে</div></li>
          <li><div class="node">মেয়ে</div></li>
          <li><div class="node">মেয়ে</div></li>
        </ul>
      </li>
    </ul>
  </div>

  <br><br>
  <button class="no-print" onclick="window.print()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">প্রিন্ট করুন</button>

</body>
                </html>
